# Tag `v*` → signed AAB → Play internal track. No local steps.
#
# "Zero local steps" is MOB12's gate and it is the point of this file: a release that requires
# somebody's laptop is a release that stops happening when that laptop is unavailable, and one whose
# signing key lives somewhere a person has to remember to back up.
#
# CREDENTIALS THIS NEEDS, none of which exist yet — see MOB0:
#
#   ANDROID_KEYSTORE_BASE64      the upload keystore, base64 of the .jks
#   ANDROID_KEYSTORE_PASSWORD    its store password
#   ANDROID_KEY_ALIAS            the alias inside it
#   ANDROID_KEY_PASSWORD         that alias's password
#   PLAY_SERVICE_ACCOUNT_JSON    a Google Play service account with "Release to testing tracks"
#
# The preflight below fails naming whichever is missing, rather than letting the job get as far as
# Gradle and fail with a null storeFile — which reads as a broken build rather than an absent
# credential, and has cost people an afternoon more than once.
#
# UPLOAD KEY, NOT APP KEY. Play App Signing holds the real key; this signs the upload. If this
# keystore is lost Google can reset it. If the app key were lost and Play did not hold it, the
# listing could never be updated again — which is why enrolling in Play App Signing is part of MOB0
# rather than an optimisation.
name: Release Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play track to publish to
        default: internal
        type: choice
        options: [internal, alpha, beta]

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false # never cancel a release mid-upload

permissions:
  contents: read

jobs:
  release:
    name: signed AAB → Play ${{ inputs.track || 'internal' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Before anything expensive. A missing secret is the most likely reason this job fails, and it
      # should say so in ten seconds rather than eight minutes into a Gradle build.
      - name: Preflight — required secrets are present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "::error::See MOB0 in ../docs/mobile-app-plan.md — the upload keystore and Play service account are prerequisites, not part of this workflow."
            exit 1
          fi
          echo "all five signing and publishing secrets are present"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21, matching the toolchain android/build.gradle pins for every module. That pin exists
          # because @capacitor/android compiles at VERSION_21 and because the workstation's ambient
          # JAVA_HOME is a JRE with no javac — see mobile/CLAUDE.md § The Android build pins its own JDK.
          java-version: 21

      - name: Install
        run: npm ci

      # The same gate ci.yml runs. A tag is not exempt from it: the whole reason this workflow exists
      # is that a bad mobile build cannot be recalled once it is in a store.
      - name: Lint, test and build
        run: |
          npm run lint
          npm run prettier:check
          npm run test:ci
          npm run build:prod

      - name: Capacitor sync
        run: npx cap sync android

      # Marketing version from package.json — stated once, there. The tag is checked against it
      # rather than used, so `git tag v0.2.0` on a tree that still says 0.1.0 fails here instead of
      # publishing a build whose version nobody can explain.
      - name: Resolve version
        id: version
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$pkg" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg — bump one or the other"
            exit 1
          fi
          echo "name=$pkg" >> "$GITHUB_OUTPUT"
          echo "resolved version $pkg, build ${{ github.run_number }}"

      - name: Materialise the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Into the runner's temp dir, not the workspace — nothing under the checkout can be
          # accidentally archived by a later step or picked up by a glob.
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "keystore written to the runner temp directory"

      - name: Build the signed AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease --no-daemon

      # Proves the AAB is actually signed rather than merely produced. An unsigned bundle uploads and
      # is rejected by Play with a message about the certificate, long after this job went green.
      - name: Verify it is signed
        run: |
          aab=android/app/build/outputs/bundle/release/app-release.aab
          [ -f "$aab" ] || { echo "::error::no AAB at $aab"; exit 1; }
          unzip -l "$aab" | grep -q 'META-INF/.*\.RSA\|META-INF/.*\.EC' \
            || { echo "::error::AAB carries no signature block — it was built unsigned"; exit 1; }
          echo "signed bundle present"

      - name: Publish to Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.abofonsa.bridgecare.professional
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
          # Release notes in all four shipping languages. The directory holds one whatsnew-<locale>
          # file per language; Play shows each tester the one matching their account, and falls back
          # to en-US for anything not listed.
          #
          # Four languages is a shipping condition for every package here, store-facing copy
          # included — an app that advertises itself in English and opens in German is an Apple
          # rejection risk, and the same reasoning applies to Play. See MOB13.
          #
          # NOTE this publishes release notes only. Title, short and full descriptions live beside
          # them in fastlane/metadata/android/<locale>/ and are NOT uploaded by this action; they
          # are applied with `fastlane supply` or pasted into the console once, because a listing
          # rarely changes and republishing it on every tag is how a reviewed listing gets reverted
          # by accident. See fastlane/metadata/README.md.
          whatsNewDirectory: fastlane/metadata/android/whatsnew

      # Kept for the case the upload step fails: without this the only signed artefact of a tagged
      # release would live on a runner that is about to be destroyed.
      - name: Keep the bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.name }}-${{ github.run_number }}.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30
